{% extends "layout.html" %}
{% block content %}

<section class="panel">
    <h2>Edit Contact #{{ contact_id }}</h2>
    <form method="post" action="{{ url_for('edit_contact', contact_id=contact_id) }}">
        <label>Name <input type="text" name="name" value="{{ contact.name }}" minlength="3" title="Name must be at least 3 characters" required></label>
        <label>Phone <input type="text" name="phone" value="{{ contact.phone }}" maxlength="15" pattern="(\+[0-9]{1,3}[ \-]?)?[0-9]{10}" title="10 digits, optionally with a country code, e.g. +91 9876543210" required></label>
        <label>Email <input type="email" name="email" value="{{ contact.email }}" required></label>
        <button type="submit">Save Changes</button>
    </form>
    <p><a href="{{ url_for('index') }}">&larr; Back to contacts</a></p>
</section>

{% endblock %}
